services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviewinsight}
      POSTGRES_USER: ${POSTGRES_USER:-reviewinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reviewinsight}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-reviewinsight}
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-3000}
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./server/app:/app/app
      - ./server/scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3000}:3000"
    volumes:
      - ./client:/app
      # keep the image's node_modules, not the host's; after changing dependencies run
      # `docker compose up --build -V` so this volume is recreated from the new image
      - /app/node_modules
    depends_on:
      - server

volumes:
  pgdata:
